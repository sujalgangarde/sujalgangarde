<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240"><style>
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes swing{0%{opacity:0;transform:translateY(40px) rotate(-6deg)}
 70%{opacity:1;transform:translateY(-6px) rotate(1deg)}100%{opacity:1;transform:none}}
@keyframes pulse{0%{r:6;opacity:.8}100%{r:26;opacity:0}}
.rise{opacity:0;animation:rise .7s ease forwards}
.fade{opacity:0;animation:fade .3s ease forwards}
.grow{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow .8s ease forwards}
.pop{transform-box:fill-box;transform-origin:center;opacity:0;animation:pop .35s ease forwards}
.swing{transform-box:fill-box;transform-origin:bottom left;opacity:0;animation:swing .9s ease forwards}
.ring{animation:pulse 2.4s ease-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
</style><rect width="900" height="240" rx="18" fill="#faf7f0" stroke="#e2ddd0"/>
<defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" x2="300" y1="0" y2="0">
<stop offset="0" stop-color="#1a1a1a"/><stop offset=".5" stop-color="#1f4fff"/>
<stop offset="1" stop-color="#1a1a1a"/>
<animateTransform attributeName="gradientTransform" type="translate"
 values="-300 0;700 0;700 0" keyTimes="0;.4;1" dur="6s" begin="1.5s" repeatCount="indefinite"/>
</linearGradient></defs>
<text class="rise" style="animation-delay:0.10s" x="40" y="110" font-family="Georgia,'Times New Roman',serif" font-size="64" fill="url(#g)">Sujal Gangarde</text>
<text class="rise" style="animation-delay:0.50s" x="42" y="160" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" fill="#8a8578">Software Engineer. I turn ideas into shipped products.</text>
<circle cx="44" cy="205" r="5" fill="#1f4fff"/>
<circle class="ring" cx="44" cy="205" r="6" fill="none" stroke="#1f4fff"/>
<text x="58" y="210" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#1a1a1a">github.com/sujalgangarde</text>
